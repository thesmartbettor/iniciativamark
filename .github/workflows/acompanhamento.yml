name: Acompanhamento MARK

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18h30 em Brasília, depois do fechamento da B3 (o GitHub costuma atrasar horas)
    - cron: "0 12 * * 2-6"    # 9h em Brasília: repescagem caso o Yahoo ainda não tivesse o pregão anterior
  push:                       # sinal novo publicado pelo PC (19h do 1º pregão): recalcula na hora
    branches: [main]
    paths: [data/sinais.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acompanhamento
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/acompanhamento.py
      - name: Salvar dados
        run: |
          git config user.name "iniciativamark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          PREGAO=$(python -c "import json; print(json.load(open('data/acompanhamento.json')).get('ultimo_pregao') or '')")
          git diff --cached --quiet || git commit -m "Acompanhamento MARK ${PREGAO:-$(TZ=America/Sao_Paulo date +%F)}"
          git pull --rebase origin main
          git push
