name: Acompanhamento MARK

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18h30 em Brasília, depois do fechamento da B3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/acompanhamento.py
      - name: Salvar dados
        run: |
          git config user.name "iniciativamark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Acompanhamento MARK $(TZ=America/Sao_Paulo date +%F)"
          git push
